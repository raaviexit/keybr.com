name: Hindi InScript implementation
on:
  push:
    branches: [feature/hindi-inscript]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hindi-inscript
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: corepack enable && pnpm install --no-frozen-lockfile
      - name: Apply Hindi implementation
        run: node scripts/implement-hindi-inscript.mjs
      - name: Validate
        run: pnpm compile && pnpm test && pnpm lint
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(hindi): implement Devanagari InScript support' || exit 0
          git push origin HEAD:feature/hindi-inscript
