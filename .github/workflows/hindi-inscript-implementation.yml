name: Hindi InScript implementation
on:
  push:
    branches: [feature/hindi-inscript]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hindi-inscript
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: npm ci
      - name: Apply Hindi implementation
        run: node scripts/implement-hindi-inscript.mjs
      - name: Validate changed files
        run: npx prettier --check packages/keybr-keyboard/lib/language.ts packages/keybr-keyboard/lib/layout.ts packages/keybr-keyboard/lib/load.ts packages/keybr-keyboard/lib/layout/hi_inscript.ts packages/keybr-content-words/lib/load.ts packages/keybr-content-words/lib/data/words-hi.json packages/keybr-keyboard/lib/language.test.ts
      - name: Compile
        run: npm run compile
      - name: Test
        run: npm test
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(hindi): implement Devanagari InScript support' || exit 0
          git push origin HEAD:feature/hindi-inscript
